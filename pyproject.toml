[project]
name = "wendes"
version = "0.1.0"
description = "Agente de IA que conduz a daily no Jitsi (pt-BR): facilita falando, transcreve e distribui a ata"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = [
    "playwright",
    "faster-whisper>=1.1",
    "piper-tts",
    "openai",
    "pydantic-settings",
    "jinja2",
    "httpx",
    "rapidfuzz",
    "soundfile",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff"]

[project.scripts]
wendes = "wendes.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.urls]
Repository = "https://github.com/gabrielsouto/wendes"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
