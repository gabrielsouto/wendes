# Configuração do Wendes — copie para config.yaml e ajuste para a sua equipe.

room:
  # Aceita as duas formas (o bot autentica com o mesmo token Firebase em ambas):
  #   https://moderated.jitsi.net/<Sala> — bot entra como moderador; equipe usa o guest link
  #   https://meet.jit.si/<Sala>         — sala pública direta; esta URL é o próprio link da equipe
  url: "https://meet.jit.si/MinhaSalaDaily"
  bot_display_name: "Wendes"
  # Espera pela abertura da conferência; no meet.jit.si sem token o bot
  # aguarda um humano autenticado abrir a sala — aumente se for o caso.
  join_timeout_seconds: 90

team:
  # Nome da equipe (opcional) — usado no prompt do LLM.
  name: ""
  # Nomes usados na chamada e casados (fuzzy) com os display names do Jitsi.
  # aliases: outras formas como a pessoa pode aparecer no Jitsi.
  # Os nomes também alimentam os hotwords do Whisper (melhora a transcrição).
  members:
    - name: "Fulana da Silva"
      aliases: ["Fulana", "fsilva"]
    - name: "Beltrano Souza"
      aliases: ["Beltrano"]

commands:
  # Comandos no chat (/comece, /pular, /encerrar, /permitir, /ajuda; /fim no stealth).
  # require_code: true (padrão) — o nome no Jitsi é livre, então só autentica
  # quem mandar "/auth <código>" por MENSAGEM PRIVADA ao bot. O código de 6
  # dígitos muda a cada execução e sai no log (journalctl), em
  # data/<data>/<hora>/admin_code.txt e por e-mail para admin_emails.
  # /auth no chat público troca o código; 3 códigos errados bloqueiam o participante.
  require_code: true
  # Recebem o código de admin por e-mail (usa smtp_host/email_from de distribution).
  admin_emails: []
  # Usado só com require_code: false — nome exato (ignora acentos, maiúsculas e
  # espaços extras), incluindo os aliases do membro em team.members. Sem fuzzy.
  # /permitir <nome> delega a permissão a outro participante durante a reunião.
  admins:
    - "Fulana da Silva"
  start_on_command: true   # bot só inicia a rodada após /comece no chat

meeting:
  # Tempo total de cada pessoa. É repartido entre as perguntas que faltam:
  # resposta rápida deixa mais tempo para as seguintes. O aviso de tempo (+20 s)
  # e o follow-up de impedimento (até 45 s) também contam nesse total.
  timebox_per_person_seconds: 120
  # Piso por pergunta, mesmo quando o tempo da pessoa já acabou.
  min_seconds_per_question: 30
  end_of_turn_silence_seconds: 2.0
  quorum: 2                 # nº mínimo de participantes humanos para começar
  wait_quorum_minutes: 10   # espera antes de desistir e avisar
  questions:
    - "O que você fez ontem?"
    - "O que vai fazer hoje?"
    - "Tem algum impedimento?"

stt:
  live_model: "small"     # faster-whisper ao vivo
  # Retranscrição pós-reunião (baixado no 1º uso). "large-v3" é mais preciso
  # em jargão/nomes que "large-v3-turbo", porém ~3-4x mais lento no CPU.
  batch_model: "large-v3-turbo"
  compute_type: "int8"
  # "cpu" (padrão), "cuda" ou "auto" (usa cuda se houver GPU visível ao ctranslate2).
  # Em cuda, prefira compute_type: "float16" (ou "int8_float16").
  device: "cpu"
  # Threads de CPU do Whisper, ao vivo e em lote (0 = todos os núcleos).
  cpu_threads: 0
  download_root: "models/whisper"
  # Contexto geral da transcrição (initial_prompt — só orienta o início).
  vocabulary: "daily, sprint, deploy, homologação"
  # Termos que o modelo realmente erra — injetados em CADA janela de áudio.
  # Mantenha curto (~10-15): lista longa dilui o efeito e induz o modelo a
  # "ouvir" esses termos onde não existem. (Se vazio, usa vocabulary + todos
  # os nomes da equipe, o comportamento antigo.)
  hotwords: []
  # Correções aplicadas depois da transcrição (palavra inteira, ignora
  # maiúsculas). Vá acumulando aqui as confusões recorrentes que aparecerem
  # nas atas, por exemplo:
  #   "termo errado": "termo certo"
  corrections: {}

tts:
  # Voz do Piper (baixe em https://github.com/rhasspy/piper/blob/master/VOICES.md)
  voice_path: "models/pt_BR-faber-medium.onnx"
  # Correções de pronúncia: {"termo escrito": "como o TTS deve falar"}
  phonetic: {}

llm:
  # Qualquer endpoint OpenAI-compatible (vLLM, Ollama, llama.cpp, OpenAI, ...)
  base_url: "http://localhost:8000/v1"
  model: "meu-modelo"
  timeout_seconds: 30
  # --- modo assist ---
  # Janela de contexto do modelo: os orçamentos de notas/perguntas saem daqui
  context_tokens: 8192
  # Requisições simultâneas ao LLM (servidor local: 1; a fila prioriza humanos)
  max_concurrency: 1
  # Como pedir JSON: none | json_object | vllm_guided | ollama_format
  structured_output: json_object
  # No vllm_guided: "guided_json" (vLLM antigo) ou "structured_outputs" (vLLM novo)
  vllm_guided_key: guided_json

browser:
  # Caminho do Chromium. Vazio: usa /usr/bin/chromium-browser se existir, senão
  # o Chromium instalado por "playwright install chromium".
  executable_path: ""

distribution:
  email_enabled: false
  smtp_host: ""
  smtp_port: 25
  email_from: ""
  email_to: []
  # POST da ata em JSON (Slack/Discord/Teams via webhook, por exemplo)
  webhook_url: ""
  # Modo assist: POST das ações estruturadas no fim da reunião (wendes send-actions reenvia)
  actions_webhook_url: ""
  # Modo assist: anexa os artefatos (.md/.mmd) ao e-mail da ata
  attach_artifacts: true

# ---- Modo assistente (wendes assist) -------------------------------------------
assistant:
  greeting: "Olá, sou o Wendes, assistente desta reunião. Estou transcrevendo para gerar notas e a ata. Qualquer pessoa pode pausar com /pausar no chat."
  speak_greeting: true
  wake_word: ""                 # vazio = room.bot_display_name
  wake_word_aliases: ["vendes", "wendis", "uendes"]
  voice_trigger: true           # "Wendes, <pergunta>" por voz
  voice_answers: true           # responde perguntas de voz falando (e no chat)
  stt:
    silence_s: 0.8              # silêncio que fecha um enunciado
    max_utterance_s: 20
    max_lag_s: 30               # atraso acima disso descarta áudio e marca lacuna
  speakers:
    enabled: false              # atribuição por nível de áudio; ver docs/SPIKE_FALANTES.md
    latency_offset_s: 0.0
    min_share: 0.6
    min_samples: 3
  notes:
    interval_s: 120             # rodada de notas a cada N s (ou antes, com min_new_chars)
    min_new_chars: 1500
    compact_every_s: 900
  permissions:
    ask: members                # all | members | admins
    history: admins             # admins | members | none (consultar reuniões anteriores)
    artifacts: members          # all | members | admins
  unknown_participant: warn     # allow | warn | pause | leave
  web:
    host: "127.0.0.1"           # 0.0.0.0 para abrir na rede local
    port: 8765                  # wendes serve usa port + 1 por padrão
    public_base_url: ""         # ex.: http://servidor.lan:8765
    allow_edit: false           # edição de artefatos pela página
  screen_share: false           # experimental (F10): /tela compartilha a página no Jitsi

actions:
  lookback_days: 14             # pendências abertas da mesma sala nesse período

data_retention:
  recording_days: 30            # apaga recording.wav depois de N dias (0 = nunca)
  transcript_days: 0            # apaga transcrições depois de N dias (0 = nunca)

data_dir: "data"
